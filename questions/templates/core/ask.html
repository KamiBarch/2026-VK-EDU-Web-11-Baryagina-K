{% extends 'core/base.html' %}
{% load static %}
{% block title %}Новый вопрос — BEST FAQ{% endblock %}
{% block content %}
<h1 class="h3 mb-4">New Question</h1>

<p class="text-danger mb-4">Please fix the errors below.</p>

<form>
    <div class="row mb-3">
        <label for="inputTitle" class="col-sm-2 col-form-label">Title</label>
        <div class="col-sm-10">
            <input type="text" class="form-control is-invalid" id="inputTitle" placeholder="Briefly describe the essence of your question." maxlength="100">
            <div class="invalid-feedback">Title cannot be empty.</div>
            <div class="form-text text-muted">Maximum 100 characters.</div>
        </div>
    </div>
    <div class="row mb-3">
        <label for="inputText" class="col-sm-2 col-form-label">Text</label>
        <div class="col-sm-10">
            <textarea class="form-control" id="inputText" rows="5" placeholder="Write your question here." maxlength="1000"></textarea>
            <div class="form-text text-muted">Maximum 1000 characters.</div>
        </div>
    </div>
    <div class="row mb-4">
        <label for="inputTags" class="col-sm-2 col-form-label">Tags</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="inputTags" placeholder="BESTALKS, ЯВ26, Motivation">
        </div>
    </div>
    <div class="row">
        <div class="col-sm-10 offset-sm-2">
            <button type="submit" class="btn btn-ask fw-bold px-4">ASK!</button>
        </div>
    </div>
</form>
{% endblock %}
