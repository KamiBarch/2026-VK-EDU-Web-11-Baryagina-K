<article id="answer-{{ answer.pk }}" class="card mb-3 shadow-sm border-0">

    <div class="card-body d-flex gap-3">
        <div class="flex-shrink-0 text-center d-flex flex-column align-items-center gap-1">
            {% include 'core/inc/author_avatar.html' with author=answer.author size=64 only %}
            <span class="fw-bold small">{{ answer.author.username }}</span>
            {% include "core/inc/answer_vote.html" with answer=answer %}

        </div>

        <div class="flex-grow-1 question-body">
            <time datetime="{{ answer.created_at|date:'c' }}" class="text-muted">{{ answer.created_at|timesince }} ago</time>

            <p class="text-break mb-3">{{ answer.text }}</p>

            <form class="form-check text-muted" method="post" action="{% url 'answer_approval' %}"
                {% if request.user.is_authenticated and request.user.pk == question.author_id %} data-answer-approval {% endif %}>
                {% csrf_token %}

                <input type="hidden" name="question_id" value="{{ question.pk }}">
                <input type="hidden" name="answer_id" value="{{ answer.pk }}">

                <input class="form-check-input" type="checkbox" id="correctCheck{{ answer.pk }}" data-approval-checkbox {% if answer.is_correct %}checked{% endif %}
                    {% if not request.user.is_authenticated %} disabled title="Log in to approve an answer" {% elif request.user.pk != question.author_id %} disabled
                    title="Only the question author can approve an answer" {% endif %}>

                <label class="form-check-label" for="correctCheck{{ answer.pk }}">Approved!</label>

                <small class="d-block text-danger" data-approval-error role="status"></small>
            </form>
        </div>
    </div>
</article>
