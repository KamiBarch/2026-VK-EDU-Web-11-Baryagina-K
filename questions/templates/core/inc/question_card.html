{% load static%}
<article class="card mb-3 shadow-sm border-0">
    <div class="card-body d-flex gap-3">
        <div class="flex-shrink-0 text-center d-flex flex-column align-items-center gap-1">
            <img src="{% static 'core/img/avatar.jpg' %}" alt="Аватар автора" class="rounded avatar mb-1" width="64" height="64">
            <button type="button" class="vote-btn active-up" aria-label="Нравится" aria-pressed="true">▲</button>
            <span class="fw-bold">0</span>
            <button type="button" class="vote-btn" aria-label="Не нравится" aria-pressed="false">▼</button>
        </div>
        <div class="flex-grow-1 question-body">
            <h2 class="h5 mb-1"><a href="{% url 'question' question.id %}" class="text-decoration-none">{{ question.title }}</a></h2>
            <p class="text-muted mb-3 text-break">{{ question.text }}</p>
            <div class="d-flex flex-wrap align-items-center gap-2 small">
                <a href="{% url 'question' question.id %}" class="text-decoration-none">Answers ({{ question.answers_count }})</a>
                <span class="text-dark ms-2">Tags:</span>
                {% for tag in question.tags %}
                <a href="{% url 'tag' tag.slug %}" class="badge text-bg-dark">{{ tag.name }}</a>
                {% endfor %}
                <time datetime="{{ question.created_at|date:'c' }}" class="ms-auto text-muted">{{ question.created_at|timesince }} ago</time>

            </div>
        </div>
    </div>
</article>
